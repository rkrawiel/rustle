{% extends "base.html" %} {% import "macros.html" as m %} {% block main %}
<h1 class="page-title">Sign in</h1>
<hr class="rule" />

{% if let Some(error) = error %} {% call m::status("error", "Error", error) %}{% endcall %} {% endif %}

<form class="form flow" method="post" action="/login">
  <div class="field">
    <label for="username">Username</label>
    <input
      id="username"
      name="username"
      type="text"
      required
      autocomplete="username"
      spellcheck="false"
      value="{{ username }}"
      autofocus
    />
  </div>

  <div class="field">
    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      required
      autocomplete="current-password"
    />
  </div>

  <div class="actions">
    <button type="submit">Sign in</button>
  </div>
</form>
{% endblock %}
