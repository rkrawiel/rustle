name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Builds from the committed .sqlx/ query cache (see PLAN.md §4's sqlx workflow) rather
  # than needing a live database just to compile. The `test` job below still needs a real
  # one at runtime, for the #[sqlx::test] suites.
  SQLX_OFFLINE: "true"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          # The role needs CREATEDB: #[sqlx::test] creates and drops a scratch database
          # per test. The official image's own POSTGRES_USER is already a superuser.
          POSTGRES_USER: rustle
          POSTGRES_PASSWORD: rustle
          POSTGRES_DB: rustle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rustle -d rustle"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rustle:rustle@localhost:5432/rustle
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  release-build:
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The Dockerfile's builder stage is the musl release build the brief's size budget
      # (< 20 MB, see PLAN.md) is measured against; building the whole image here is the
      # same check `deploy/README.md`'s bare-metal path runs to produce the binary itself.
      - run: docker build -t rustle:ci .
      - name: Check the release binary exists and fits the size budget
        run: |
          id=$(docker create rustle:ci)
          docker cp "$id:/usr/local/bin/rustle" ./rustle
          docker rm "$id" >/dev/null
          size=$(stat -c%s ./rustle)
          echo "release binary: $size bytes"
          test "$size" -lt $((20 * 1024 * 1024))
